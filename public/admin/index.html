<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Movie Mood</title><style>body{margin:0;background:#09090c;color:#fff;font-family:system-ui}.wrap{max-width:1100px;margin:auto;padding:25px}.bar{display:flex;justify-content:space-between;align-items:center}.panel{background:#121218;border:1px solid #2b2b35;border-radius:15px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{width:100%;box-sizing:border-box;background:#09090c;border:1px solid #2b2b35;color:#fff;border-radius:9px;padding:10px;margin:5px 0}button{padding:9px 13px;border-radius:9px;border:1px solid #333;background:#1b1b22;color:#fff;cursor:pointer}.primary{background:#ff375f;border-color:#ff375f}.row{padding:10px 0;border-bottom:1px solid #292930;font-size:13px}.muted{color:#9b9ba7}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="bar"><div><b>MOVIE <span style="color:#ff375f">MOOD</span> / ADMIN</b><p class="muted">College DBMS control panel</p></div><button onclick="location.href='/'">← Back to app</button></div><div id="app">Loading…</div></div><script>
const API=window.__HATCHABLE__.api,$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){const s=await hatchable.auth.getSession();if(!s?.user){location.href='/login?next=/admin/';return}const pr=await fetch(API+'/profile'),me=await pr.json();if(me?.role!=='admin'){document.body.innerHTML='<div class="wrap"><div class="panel">Admin access required. <button onclick="location.href=\'\'/'\''>Back</button></div></div>';return}const r=await fetch(API+'/admin'),d=await r.json();$('app').innerHTML='<div class="grid"><div class="panel"><h2>Add movie</h2><input class="field" id="t" placeholder="Title"><input class="field" id="g" placeholder="Genre"><input class="field" id="l" placeholder="Language"><input class="field" id="y" placeholder="Release year"><input class="field" id="r" placeholder="Rating / 10"><input class="field" id="p" placeholder="Poster URL"><textarea class="field" id="d" placeholder="Description"></textarea><button class="primary" onclick="saveMovie()">Add movie</button></div><div class="panel"><h2>Moods</h2><input class="field" id="mn" placeholder="😊 New mood"><button class="primary" onclick="addMood()">Add</button><div>'+d.moods.map(x=>'<div class="row">'+esc(x.mood_name)+' <button onclick="editMood(\''+x.mood_id+'\',\''+esc(x.mood_name).replace(/'/g,'')+'\')">Edit</button> <button onclick="delMood(\''+x.mood_id+'\')">Delete</button></div>').join('')+'</div></div></div><div class="panel"><h2>Movies & CRUD</h2>'+d.movies.map(x=>'<div class="row"><b>'+esc(x.title)+'</b> · '+esc(x.genre)+' · '+x.release_year+' · ★'+x.rating+' <button onclick="editMovie(\''+x.movie_id+'\')">Edit</button> <button onclick="delMovie(\''+x.movie_id+'\')">Delete</button></div>').join('')+'</div><div class="panel"><h2>Movie ↔ Mood relationships</h2><select class="field" id="mid">'+d.movies.map(x=>'<option value="'+x.movie_id+'">'+esc(x.title)+'</option>').join('')+'</select><select class="field" id="moid">'+d.moods.map(x=>'<option value="'+x.mood_id+'">'+esc(x.mood_name)+'</option>').join('')+'</select><button class="primary" onclick="link()">Link</button> <button onclick="unlink()">Unlink</button></div><div class="panel"><h2>Registered users</h2>'+d.users.map(x=>'<div class="row">'+esc(x.name)+' · '+esc(x.email)+' · <b>'+x.role+'</b></div>').join('')+'</div><div class="panel"><h2>Reviews</h2>'+d.reviews.map(x=>'<div class="row">'+esc(x.name)+' · '+esc(x.title)+' · ★'+x.rating+'<br>'+esc(x.comment)+' <button onclick="delReview(\''+x.review_id+'\')">Delete</button></div>').join('')+'</div>'}
async function post(body,method='POST'){return fetch(API+'/admin',{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
async function saveMovie(){await post({action:'movie-save',title:$('t').value,genre:$('g').value,language:$('l').value,release_year:$('y').value,rating:$('r').value,poster_url:$('p').value,description:$('d').value});load()}async function editMovie(id){const x=(await (await fetch(API+'/admin')).json()).movies.find(m=>m.movie_id===id);const title=prompt('Title',x.title);if(title===null)return;const genre=prompt('Genre',x.genre),language=prompt('Language',x.language),year=prompt('Year',x.release_year),rating=prompt('Rating',x.rating),desc=prompt('Description',x.description),poster=prompt('Poster URL',x.poster_url||'');await post({action:'movie-update',movie_id:id,title,genre,language,release_year:year,rating,description:desc,poster_url:poster},'PUT');load()}async function delMovie(id){if(confirm('Delete movie?')){await post({action:'movie-delete',movie_id:id},'DELETE');load()}}async function addMood(){await post({action:'mood-add',mood_name:$('mn').value});load()}async function editMood(id,old){const name=prompt('Mood name',old);if(name){await post({action:'mood-update',mood_id:id,mood_name:name},'PUT');load()}}async function delMood(id){if(confirm('Delete mood?')){await post({action:'mood-delete',mood_id:id},'DELETE');load()}}async function link(){await post({action:'link',movie_id:$('mid').value,mood_id:$('moid').value});alert('Relationship linked')}async function unlink(){await post({action:'unlink',movie_id:$('mid').value,mood_id:$('moid').value});alert('Relationship unlinked')}async function delReview(id){if(confirm('Delete review?')){await post({action:'review-delete',review_id:id},'DELETE');load()}}load();
</script></body></html>
