<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Mood Recommendation System</title>
<style>
:root{--bg:#09090c;--panel:#121218;--panel2:#181820;--line:#2b2b35;--text:#f7f7fa;--muted:#9b9ba7;--accent:#ff375f;--gold:#ffc857}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#32131d 0,#09090c 38%),#09090c;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:1280px;margin:auto;padding:0 22px 60px}.nav{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d;position:sticky;top:0;background:#09090de8;backdrop-filter:blur(14px);z-index:10}.brand{font-weight:900;font-size:20px;letter-spacing:-.05em}.brand i{color:var(--accent);font-style:normal}.links{display:flex;gap:5px;align-items:center}.links button,.navbtn{background:transparent;color:#c5c5ce;border:0;padding:9px 11px;border-radius:9px;cursor:pointer}.links button:hover,.links .active{background:#ffffff0c;color:white}.user{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--muted)}.hero{padding:70px 0 45px;display:grid;grid-template-columns:1.1fr .9fr;gap:35px;align-items:center}.kicker{color:var(--accent);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:11px}.hero h1{font-size:clamp(42px,6vw,76px);line-height:.92;letter-spacing:-.07em;margin:12px 0 18px}.hero p{color:var(--muted);font-size:17px;line-height:1.6;max-width:620px}.primary{background:var(--accent);border:1px solid var(--accent);color:white;font-weight:800;padding:12px 18px;border-radius:11px;cursor:pointer}.secondary{background:#17171e;border:1px solid var(--line);color:white;padding:11px 15px;border-radius:11px;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap}.heroart{height:330px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(145deg,#2b1018,#16161e 55%,#0d0d12);position:relative;overflow:hidden;box-shadow:0 30px 80px #0008}.heroart:before{content:"🎬";font-size:150px;position:absolute;right:25px;top:45px;filter:drop-shadow(0 25px 25px #000)}.heroart:after{content:"MOOD\A MATCHED";white-space:pre;position:absolute;left:25px;bottom:22px;font-size:30px;font-weight:900;line-height:.9;letter-spacing:-.06em}.section{padding:28px 0}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.section h2{font-size:30px;letter-spacing:-.05em;margin:0}.muted{color:var(--muted)}.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mood{padding:20px;border:1px solid var(--line);background:linear-gradient(145deg,#17171e,#101014);border-radius:16px;color:white;text-align:left;cursor:pointer;transition:.2s}.mood:hover{transform:translateY(-3px);border-color:#ffffff35}.mood .emoji{font-size:30px;display:block;margin-bottom:10px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.movie{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;cursor:pointer;transition:.2s}.movie:hover{transform:translateY(-4px);border-color:#ffffff35}.poster{height:245px;background:linear-gradient(145deg,#24242d,#101014);overflow:hidden;position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease,filter .35s ease}.movie:hover .poster img{transform:scale(1.05);filter:saturate(1.12)}.poster:after{content:'▶';position:absolute;right:10px;bottom:10px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#000a;border:1px solid #ffffff2b;color:#fff;font-size:12px;opacity:.85}.moviebody{position:relative}.moviebody{padding:12px}.moviebody h3{font-size:15px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);line-height:1.5}.rating{color:var(--gold);font-weight:800}.toolbar{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:9px;margin:18px 0}.field{background:#101015;border:1px solid var(--line);color:white;padding:11px;border-radius:10px;width:100%}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px}.detail{display:grid;grid-template-columns:280px 1fr;gap:25px}.detail .poster{height:410px;border-radius:14px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#22222b;border:1px solid var(--line);padding:6px 9px;border-radius:999px;font-size:12px}.review{border-top:1px solid var(--line);padding:14px 0}.review b{font-size:13px}.review p{color:#c8c8d0;line-height:1.5}.empty{padding:50px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{max-width:900px;width:100%;max-height:90vh;overflow:auto;background:#111116;border:1px solid var(--line);border-radius:18px;padding:22px}.close{float:right;background:none;color:white;border:0;font-size:24px;cursor:pointer}@media(max-width:950px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,1fr)}.moods{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}.adminGrid{grid-template-columns:1fr}}@media(max-width:600px){.links button:nth-child(n+4){display:none}.cards{grid-template-columns:repeat(2,1fr)}.poster{height:210px}.wrap{padding:0 14px 40px}.hero{padding-top:40px}.heroart{height:220px}.toolbar{grid-template-columns:1fr}.moods{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<nav class="nav"><div class="brand">MOVIE <i>MOOD</i></div><div class="links"><button data-page="home">Home</button><button data-page="movies">Movies</button><button data-page="moods">Moods</button><button data-page="search">Search</button><button data-page="history">History</button><button data-page="admin" id="adminNav" style="display:none" onclick="location.href='/admin/'">Admin</button></div><div class="user"><span id="who"></span><button class="navbtn" id="authBtn">Login</button></div></nav>
<main id="app"></main></div><div id="modal"></div>
<script>
const $=x=>document.getElementById(x),API=window.__HATCHABLE__.api;let me=null,cache={movies:[],moods:[]};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function session(){const s=await hatchable.auth.getSession();if(s?.user){let p=await fetch(API+'/profile');me=await p.json();if(!me||!me.user_id){const name=prompt('Welcome! Enter your name to create your profile:');if(name){const r=await fetch(API+'/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});me=await r.json()}}}renderNav()}
function renderNav(){$('who').textContent=me?.name||'';$('authBtn').textContent=me?'Logout':'Login';$('adminNav').style.display=me?.role==='admin'?'block':'none'}
$('authBtn').onclick=async()=>{if(me){await hatchable.auth.signOut();me=null;location.reload()}else location.href='/login?next=/'};
async function getMovies(q=''){const r=await fetch(API+'/movies'+q);cache.movies=await r.json();return cache.movies}async function getMoods(){const r=await fetch(API+'/moods');cache.moods=await r.json();return cache.moods}
function cards(ms){return '<div class="cards">'+ms.map(m=>`<article class="movie" onclick="details('${m.movie_id}')"><div class="poster"><img src="${esc(m.poster_url)}" alt="${esc(m.title)} poster" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/600x900/181820/ffffff?text='+encodeURIComponent('${esc(m.title)}')"></div><div class="moviebody"><h3>${esc(m.title)}</h3><div class="meta">${esc(m.genre)} · ${m.release_year}<br><span class="rating">★ ${m.rating}</span> · ${esc(m.language)}</div></div></article>`).join('')+'</div>'}
function home(){return `<section class="hero"><div><div class="kicker">Database-powered recommendations</div><h1>What are you feeling tonight?</h1><p>Pick a mood and discover movies connected through our relational movie-mood database. Ratings, genres, languages and your own watch history help you explore.</p><div class="actions"><button class="primary" onclick="page('moods')">Find My Movie →</button><button class="secondary" onclick="page('movies')">Browse all movies</button></div></div><div class="heroart"></div></section><section class="section"><div class="sectionhead"><div><h2>Popular picks</h2><span class="muted">Highest database ratings</span></div></div><div id="popular"></div></section><section class="section"><div class="sectionhead"><div><h2>Choose a mood</h2><span class="muted">Recommendations use the movie_mood relationship</span></div></div><div id="homeMoods" class="moods"></div></section>`}
function moodButtons(ms){return ms.map(m=>`<button class="mood" onclick="recommend('${esc(m.mood_name)}')"><span class="emoji">${esc(m.mood_name).slice(0,2)}</span><b>${esc(m.mood_name).slice(2)}</b><small class="muted"><br>${m.movie_count} movies</small></button>`).join('')}
async function renderHome(){const ms=await getMoods();$('homeMoods').innerHTML=moodButtons(ms);const movies=await getMovies();$('popular').innerHTML=cards(movies.slice(0,5))}
async function moods(){const ms=await getMoods();return `<section class="section"><div class="sectionhead"><div><h2>Choose your mood</h2><span class="muted">Every mood has its own database ID and movie relationships.</span></div></div><div class="moods">${moodButtons(ms)}</div><div id="rec" style="margin-top:25px"></div></section>`}
async function recommend(mood){const r=await fetch(API+'/movies?mood='+encodeURIComponent(mood));const ms=await r.json();$('rec').innerHTML='<div class="sectionhead"><div><h2>'+esc(mood)+' recommendations</h2><span class="muted">Ordered by rating descending</span></div></div>'+cards(ms)}
async function movies(){return `<section class="section"><div class="sectionhead"><div><h2>Movie Library</h2><span class="muted">Search and filter the relational database.</span></div></div><div class="toolbar"><input class="field" id="search" placeholder="Search title with LIKE..."><input class="field" id="genre" placeholder="Genre"><input class="field" id="lang" placeholder="Language"><input class="field" id="year" placeholder="Year" type="number"><select class="field" id="min"><option value="">Min rating</option><option>6</option><option>7</option><option>8</option><option>9</option></select></div><button class="primary" onclick="filterMovies()">Apply filters</button><div id="library" style="margin-top:18px"></div></section>`}
async function renderMovies(){const ms=await getMovies();$('library').innerHTML=cards(ms)}
async function filterMovies(){let q=new URLSearchParams();if($('search').value)q.set('search',$('search').value);if($('genre').value)q.set('genre',$('genre').value);if($('lang').value)q.set('language',$('lang').value);if($('year').value)q.set('year',$('year').value);if($('min').value)q.set('min_rating',$('min').value);$('library').innerHTML=cards(await getMovies('?'+q))}
async function searchPage(){return `<section class="section"><h2>Search & Filters</h2><p class="muted">Use title search, genre, language, year and rating. Mood filtering is available below.</p><div class="panel"><input class="field" id="s2" placeholder="Search movie title..."><select class="field" id="moodFilter" style="margin-top:10px"><option value="">All moods</option>${(await getMoods()).map(x=>'<option>'+esc(x.mood_name)+'</option>').join('')}</select><button class="primary" style="margin-top:10px" onclick="searchAdvanced()">Search</button></div><div id="searchResults" style="margin-top:18px"></div></section>`}
async function searchAdvanced(){let q=new URLSearchParams();if($('s2').value)q.set('search',$('s2').value);if($('moodFilter').value)q.set('mood',$('moodFilter').value);$('searchResults').innerHTML=cards(await getMovies('?'+q))}
async function details(id){const r=await fetch(API+'/movie?id='+id),m=await r.json();if(me)fetch(API+'/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({movie_id:id})});$('modal').innerHTML=`<div class="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div class="detail"><div class="poster"><img src="${esc(m.poster_url)}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'"></div><div><div class="kicker">${esc(m.language)} · ${m.release_year}</div><h1 style="font-size:42px;margin:8px 0">${esc(m.title)}</h1><p class="muted">${esc(m.genre)}</p><div class="tags">${m.moods.map(x=>'<span class="tag">'+esc(x.mood_name)+'</span>').join('')}</div><h3>★ ${m.rating} <span class="muted">· user avg ${m.user_avg} (${m.review_count} reviews)</span></h3><p style="line-height:1.7;color:#d4d4db">${esc(m.description)}</p>${me?'<button class="primary" onclick="reviewForm(\''+m.movie_id+'\')">Write / edit review</button>':'<p class="muted">Sign in to review and rate this movie.</p>'}</div></div><div style="margin-top:25px"><h2>User reviews</h2>${m.reviews.length?m.reviews.map(r=>'<div class="review"><b>'+esc(r.name)+' · <span class="rating">★ '+r.rating+'/5</span></b><p>'+esc(r.comment)+'</p></div>').join(''):'<div class="empty">No reviews yet.</div>'}</div></div></div>`}
function closeModal(){$('modal').innerHTML=''}function reviewForm(id){$('modal').innerHTML+=`<div class="modal"><div class="modalbox" style="max-width:520px"><button class="close" onclick="this.closest('.modal').remove()">×</button><h2>Your review</h2><select class="field" id="rr"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><textarea class="field" id="rc" style="margin-top:10px;height:120px" placeholder="Share your thoughts..."></textarea><button class="primary" style="margin-top:10px" onclick="saveReview('${id}')">Save review</button></div></div>`}async function saveReview(id){const r=await fetch(API+'/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({movie_id:id,rating:+$('rr').value,comment:$('rc').value})});if(r.ok){closeModal();details(id)}else alert((await r.json()).error)}
async function history(){if(!me)return '<section class="section"><div class="empty"><h2>Sign in to view watch history</h2><button class="primary" onclick="location.href=\'/login?next=/\'">Login</button></div></section>';const r=await fetch(API+'/history'),ms=await r.json();return '<section class="section"><h2>Your Watch History</h2><p class="muted">Movies you opened are recorded in watch_history.</p>'+(ms.length?cards(ms):'<div class="empty">Your history is empty. Open a movie to record it.</div>')+'</section>'}
async function admin(){if(me?.role!=='admin')return '<section class="section"><div class="empty">Admin access required.</div></section>';const r=await fetch(API+'/admin'),d=await r.json();return '<section class="section"><h2>Admin Dashboard</h2><p class="muted">CRUD operations, users, reviews and movie-mood relationships.</p><div class="adminGrid"><div class="panel"><h3>Add Movie</h3><input class="field" id="at" placeholder="Title"><input class="field" id="ag" placeholder="Genre" style="margin-top:8px"><input class="field" id="al" placeholder="Language" style="margin-top:8px"><input class="field" id="ay" placeholder="Year" style="margin-top:8px"><input class="field" id="ar" placeholder="Rating / 10" style="margin-top:8px"><input class="field" id="ap" placeholder="Poster URL" style="margin-top:8px"><textarea class="field" id="ad" placeholder="Description" style="margin-top:8px"></textarea><button class="primary" style="margin-top:8px" onclick="addMovie()">Add movie</button></div><div class="panel"><h3>Moods</h3><input class="field" id="mn" placeholder="😊 New mood"><button class="primary" style="margin-top:8px" onclick="addMood()">Add mood</button><div style="margin-top:12px">'+d.moods.map(x=>'<div class="review">'+esc(x.mood_name)+' <button class="secondary" onclick="delMood(\''+x.mood_id+'\')">Delete</button></div>').join('')+'</div></div></div><div class="panel" style="margin-top:15px"><h3>Movies</h3><table class="table"><tr><th>Title</th><th>Genre</th><th>Year</th><th>Action</th></tr>'+d.movies.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.genre)+'</td><td>'+x.release_year+'</td><td><button class="secondary" onclick="delMovie(\''+x.movie_id+'\')">Delete</button></td></tr>').join('')+'</table></div><div class="panel" style="margin-top:15px"><h3>Registered Users</h3><table class="table"><tr><th>Name</th><th>Email</th><th>Role</th></tr>'+d.users.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td>'+x.role+'</td></tr>').join('')+'</table></div><div class="panel" style="margin-top:15px"><h3>Reviews</h3>'+d.reviews.map(x=>'<div class="review"><b>'+esc(x.name)+' · '+esc(x.title)+' · ★'+x.rating+'</b><p>'+esc(x.comment)+'</p></div>').join('')+'</div></section>'}
async function addMovie(){await fetch(API+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'movie-save',title:$('at').value,genre:$('ag').value,language:$('al').value,release_year:$('ay').value,rating:$('ar').value,poster_url:$('ap').value,description:$('ad').value})});page('admin')}async function addMood(){await fetch(API+'/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'mood-add',mood_name:$('mn').value})});page('admin')}async function delMovie(id){if(confirm('Delete this movie?')){await fetch(API+'/admin',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'movie-delete',movie_id:id})});page('admin')}}async function delMood(id){if(confirm('Delete this mood?')){await fetch(API+'/admin',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'mood-delete',mood_id:id})});page('admin')}}
async function page(name){document.querySelectorAll('.links button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));let out=name==='home'?home():name==='moods'?await moods():name==='movies'?await movies():name==='search'?await searchPage():name==='history'?await history():await admin();$('app').innerHTML=out;if(name==='home')renderHome();if(name==='movies')renderMovies()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));session().then(()=>page('home'));
</script></body></html>
