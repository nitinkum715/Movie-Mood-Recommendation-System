<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Movie Mood</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090c;color:#fff;font-family:system-ui}.box{width:min(420px,90vw);padding:30px;background:#121218;border:1px solid #2b2b35;border-radius:18px}h1{letter-spacing:-.05em}i{color:#ff375f}input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;background:#09090c;border:1px solid #2b2b35;border-radius:10px;color:#fff}.code{display:none}button{width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px;background:#ff375f;color:#fff;font-weight:800;cursor:pointer}p{color:#9b9ba7;line-height:1.5}</style></head><body><div class="box"><b>MOVIE <i>MOOD</i></b><h1>Find your next movie.</h1><p>Sign in with your email. We'll send a one-time code—no password stored.</p><form id="f"><input id="email" type="email" placeholder="Email" autocomplete="username webauthn" required><input id="code" class="code" inputmode="numeric" placeholder="6-digit code"><button id="btn">Continue</button></form><p id="msg"></p></div><script>const A=hatchable.auth,e=document.getElementById('email'),c=document.getElementById('code'),b=document.getElementById('btn'),msg=document.getElementById('msg');let step=0;f.onsubmit=async x=>{x.preventDefault();try{if(!step){await A.startLogin({email:e.value});step=1;c.style.display='block';b.textContent='Sign in';msg.textContent='Check your email for the code.'}else{await A.verifyCode({email:e.value,code:c.value});location.href=new URLSearchParams(location.search).get('next')||'/'}}catch(err){msg.textContent=err.message||'Unable to sign in.'}}</script></body></html>
